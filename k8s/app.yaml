apiVersion: apps/v1
kind: Deployment
metadata:
  name: studentapp
spec:
  replicas: 2
  selector:
    matchLabels: { app: studentapp }
  template:
    metadata:
      labels: { app: studentapp }
    spec:
      containers:
        - name: studentapp
          image: studentapp:1.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: postgres-secret, key: POSTGRES_DB } }
            - name: ConnectionStrings__Default
              value: Host=postgres;Database=$(DB_NAME);Username=$(DB_USER);Password=$(DB_PASSWORD)
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: studentapp
spec:
  type: NodePort
  selector: { app: studentapp }
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
